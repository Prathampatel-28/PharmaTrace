<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Ledger – PharmaTrace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class="nav-brand" href="index.html">💊 PharmaTrace</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="manufacturer.html">Manufacturer</a></li>
                <li><a href="retailer.html">Retailer</a></li>
                <li><a href="customer.html">Customer</a></li>
                <li><a class="active" href="ledger.html">Ledger</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <div>
                <h1>📜 Medicine Public Ledger</h1>
                <p>Complete audit record of all registered medicine batches and their latest statuses</p>
            </div>
            <a class="btn" href="manufacturer.html">+ Register New Batch</a>
        </header>

        <div class="card">
            <div id="ledgerList" class="batch-list">Loading registered batches...</div>
        </div>
    </main>

    <footer>
        <p>© 2026 PharmaTrace • Public Ledger</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const listContainer = document.getElementById('ledgerList');

            try {
                const batches = await api('/api/medicines');

                if (!batches || batches.length === 0) {
                    listContainer.textContent = 'No medicine batches registered yet. Go to Manufacturer to register the first one!';
                    return;
                }

                listContainer.innerHTML = '';

                batches.forEach(function (batch) {
                    const card = document.createElement('div');
                    card.className = 'batch-card';

                    const name = document.createElement('div');
                    name.className = 'batch-name';
                    name.textContent = batch.medicineName;

                    const batchNum = document.createElement('p');
                    batchNum.innerHTML = `<strong>Batch:</strong> ${batch.batchNumber}`;

                    const status = document.createElement('p');
                    status.innerHTML = `<strong>Status:</strong> <span class="${getStatusBadgeClass(batch.currentStatus)}">${batch.currentStatus}</span>`;

                    const dates = document.createElement('p');
                    dates.style.color = '#64748b';
                    dates.textContent = `Mfg: ${batch.mfgDate} | Exp: ${batch.expDate}`;

                    const viewLink = document.createElement('a');
                    viewLink.href = 'customer.html?id=' + batch._id;
                    viewLink.textContent = 'View Customer Verification Details →';
                    viewLink.style.display = 'inline-block';
                    viewLink.style.marginTop = '8px';

                    card.append(name, batchNum, status, dates, viewLink);
                    listContainer.appendChild(card);
                });
            } catch (error) {
                listContainer.textContent = 'Error loading ledger: ' + error.message;
            }
        });
    </script>
</body>
</html>
